# ===== AI Teacher 生产环境编排 =====
# 说明：
# - 数据库/对象存储/直播在正式商用时优先使用腾讯云托管（TencentDB、COS、CSS 直播），
#   本 compose 提供一体化自托管方案，适用于试点学校/私有化演示。
# - 核心业务 IP（教学 Skill、流程编排）只在云端后端，客户端（教室盒子/小程序）只调用，不落地。
#
# 启动：docker compose -f docker-compose.prod.yml up -d
#
# 【操作规范】
# - 日常启停: docker compose -f docker-compose.prod.yml start / stop
# - 禁止随意 down / rm，容器删除后重建耗时久
# - 仅大版本变动时才 down + up -d 重建
# ============================================================

name: ai-tutor-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: ait-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-ait_prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env.prod 设置强密码}
      POSTGRES_DB: ${DB_NAME:-ai_teacher}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ait_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: ait-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?请在 .env.prod 设置密码} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    container_name: ait-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?设置 MinIO access key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?设置 MinIO secret key}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # 直播流媒体服务器（SRS）：教室推流、家长小程序拉流
  srs:
    image: ossrs/srs:5
    container_name: ait-srs
    restart: always
    command: ./objs/srs -c conf/docker.conf
    ports:
      - "1935:1935"   # RTMP 推流
      - "8080:8080"   # HTTP-FLV / HLS
      - "1985:1985"   # SRS API
    volumes:
      - srsdata:/usr/local/srs/objs/nginx/html

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ait-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-ait_prod}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-ai_teacher}?schema=public
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT 密钥}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"

  mobile-web:
    build:
      context: ../../apps/mobile
      dockerfile: Dockerfile
      args:
        # 生产同域反代；若前后端不同域，改为正式 HTTPS 地址
        VITE_API_BASE: /api/v1
    container_name: ait-web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
  srsdata:
