# SRS 流媒体服务配置
listen              1935;
max_connections     100;
daemon              off;
srs_log_tank        file;
srs_log_file        ./objs/srs.log;
http_api {
    enabled         on;
    listen          1985;
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
vhost __defaultVhost__ {
    hls {
        enabled     on;
        hls_fragment 5;
        hls_window   60;
    }
}
