# AI Teacher 教室端视觉服务
# 运行在树莓派5上，负责人脸识别、举手检测、纪律检测、音频采集、双链路切换

[service]
# 后端API地址
api_url = http://localhost:3000/api/v1
# 设备序列号（开发环境）
device_serial = DEV-BOX-001
# 边缘端鉴权 token（与后端 EDGE_API_TOKEN 一致；留空表示后端未启用鉴权）
edge_token =
# 远程配置轮询间隔（秒），用于感知上课/下课并刷新课次上下文
config_poll_interval = 30
# 心跳间隔（秒）
heartbeat_interval = 30
# 摄像头ID
camera_id = 0
# 摄像头分辨率
camera_width = 1280
camera_height = 720
# 摄像头帧率
camera_fps = 15

[face]
# 人脸识别置信度阈值
confidence_threshold = 0.6
# 人脸库路径
face_db_path = ./data/faces
# 检测间隔（帧）
detect_interval = 5

[behavior]
# 举手检测置信度
hand_raise_threshold = 0.7
# 纪律检测间隔（秒）
discipline_interval = 2
# 说话检测音量阈值
noise_threshold = 0.3
# 趴桌/睡觉检测阈值
sleep_threshold = 0.8

[network]
# 主链路（有线网）
primary_interface = eth0
# 备用链路（4G）
backup_interface = usb0
# 健康检查间隔（秒）
check_interval = 5
# 切换超时（秒）
switch_timeout = 3

[audio]
# 麦克风设备
mic_device = default
# 采样率
sample_rate = 16000
# 通道数
channels = 4
