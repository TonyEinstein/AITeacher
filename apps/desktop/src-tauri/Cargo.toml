[package]
name = "ai-teacher-desktop"
version = "1.0.0"
description = "AI Teacher 桌面端"
authors = ["AI Teacher"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_teacher_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2.12.0"
tauri-plugin-opener = "2.5.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
